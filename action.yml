name: "Build and Push to Ryvn Registry"
description: "Builds and pushes Docker images or Helm charts to Ryvn Registry"

inputs:
  service_name:
    description: "Name of the service"
    required: true
  version:
    description: "Semantic version to tag the image/chart with"
    required: true
  build_only:
    description: "Build only, don't push to registry"
    required: false
    default: "false"
  ryvn_client_id:
    description: "Ryvn Client ID for static-credential authentication. Not needed when the job has `id-token: write` and the Ryvn org has keyless CI auth enabled; the CLI then authenticates with the job's GitHub OIDC token."
    required: false
    default: ""
  ryvn_client_secret:
    description: "Ryvn Client Secret for static-credential authentication (see ryvn_client_id)"
    required: false
    default: ""
  ryvn_org_id:
    description: "Ryvn organization ID. Only needed when more than one Ryvn organization trusts this repository (optional)"
    required: false
    default: ""
  ryvn_cli_version:
    description: "Ryvn CLI release to install; must be v1.249.0 or newer (the registry-config, chart and image commands). Defaults to v1.249.0 (optional)"
    required: false
    default: ""
  ryvn_api_url:
    description: "Ryvn API URL for self-hosted or dev instances (optional)"
    required: false
  ryvn_auth_url:
    description: "Ryvn Auth URL for self-hosted or dev instances (optional)"
    required: false
  ryvn_project_id:
    description: "Ryvn Project ID for local dev setups (optional)"
    required: false
  build_args:
    description: "Build arguments to pass to the Docker build"
    required: false
  platforms:
    description: "List of target platforms for build"
    required: false
    default: "linux/amd64"
  use_nixpacks:
    description: "Use Nixpacks to build Docker images instead of Dockerfile"
    required: false
    default: "false"
  nixpacks_pkgs:
    description: "Additional Nix packages to install in the environment"
    required: false
    default: ""
  nixpacks_apt:
    description: "Additional Apt packages to install in the environment"
    required: false
    default: ""
  nixpacks_cache:
    description: "Use the Nixpacks build cache"
    required: false
    default: "true"
  buildx_endpoint:
    description: "Docker Buildx endpoint for remote driver"
    required: false
    default: ""
  buildx_driver:
    description: "Docker Buildx driver type"
    required: false
    default: ""
  disable_cache:
    description: "Disable all caching (GitHub Actions cache and build cache)"
    required: false
    default: "false"
  build_secrets:
    description: "Docker BuildKit secrets (KEY=VALUE per line). Mounted via --secret so they don't leak into image layers. Users access them with RUN --mount=type=secret,id=KEY in their Dockerfile."
    required: false
    default: ""

outputs:
  build_artifacts:
    description: "JSON array of artifacts built by this action"
    value: ${{ steps.artifacts.outputs.build_artifacts }}

runs:
  using: "composite"
  steps:
    # Registry login, chart packaging/publishing and image inspection are CLI
    # commands, so the default is the oldest release that carries them. An
    # older explicit pin fails at the first missing command.
    - name: Install Ryvn CLI
      uses: ryvn-technologies/install-ryvn-cli@v1.0.0
      env:
        RYVN_CLI_VERSION: ${{ inputs.ryvn_cli_version || 'v1.249.0' }}

    # One private directory per invocation for every transient file (service
    # and registry metadata, registry config, chart package, artifacts) so
    # several invocations in one job never see each other's state and nothing
    # is written into the checkout. Removed by the cleanup step.
    - name: Create build workspace
      id: workspace
      shell: bash
      run: |
        set -euo pipefail
        echo "dir=$(mktemp -d "$RUNNER_TEMP/ryvn-build.XXXXXX")" >> "$GITHUB_OUTPUT"

    - name: Print Runner Info
      shell: bash
      run: |
        echo "Runner name: ${{ runner.name }}"
        echo "Runner OS: ${{ runner.os }}"
        echo "Runner architecture: ${{ runner.arch }}"
        echo "Runner labels: ${{ runner.labels }}"

    - name: Get Service and Registry Details from Ryvn API
      id: service
      shell: bash
      env:
        # Empty when the caller relies on keyless CI auth: the CLI exchanges the
        # job's GitHub OIDC token itself and uses these only as the documented
        # fallback. Hub inputs override the job environment for this step only.
        RYVN_CLIENT_ID: ${{ inputs.ryvn_client_id }}
        RYVN_CLIENT_SECRET: ${{ inputs.ryvn_client_secret }}
        RYVN_API_URL: ${{ inputs.ryvn_api_url || env.RYVN_API_URL }}
        RYVN_AUTH_URL: ${{ inputs.ryvn_auth_url || env.RYVN_AUTH_URL }}
        RYVN_ORG_ID: ${{ inputs.ryvn_org_id || env.RYVN_ORG_ID }}
        RYVN_PROJECT_ID: ${{ inputs.ryvn_project_id || env.RYVN_PROJECT_ID }}
        SERVICE_NAME: ${{ inputs.service_name }}
        BUILD_ONLY: ${{ inputs.build_only }}
        USE_NIXPACKS: ${{ inputs.use_nixpacks }}
        INPUT_BUILD_ARGS: ${{ inputs.build_args }}
        WORKSPACE: ${{ steps.workspace.outputs.dir }}
      run: |
        set -euo pipefail
        service_json="$WORKSPACE/service.json"
        ryvn get service "$SERVICE_NAME" -o json > "$service_json"
        echo "Service details: $(cat "$service_json")"

        service_type=$(jq -r '.definition.type' "$service_json")
        if [ "$service_type" = "null" ] || [ -z "$service_type" ]; then
          echo "Error: service type not found in service definition"
          exit 1
        fi

        container_build=false
        case "$service_type" in
          web-server.v1|job.v1) container_build=true ;;
        esac
        image_ref=""
        if [ "$container_build" = "true" ]; then
          image_ref=$(jq -r '.definition.image // ""' "$service_json")
          if [ -z "$image_ref" ]; then
            echo "Error: $service_type service has no image publish destination"
            exit 1
          fi
        fi

        # The registry the service is bound to decides how the runner logs in
        # (Ryvn-managed ECR: AWS role; Google Artifact Registry: ryvn create
        # registry-config). Destinations are resolved by the CLI at push time.
        # build_only needs no registry. Reading it needs registry.read.
        registry_provider=""
        if [ "$BUILD_ONLY" != "true" ] && { [ "$container_build" = "true" ] || [ "$service_type" = "helm-chart.v1" ]; }; then
          registry_name=$(jq -r '.definition.registry // "ryvn-registry"' "$service_json")
          if ! ryvn get registry "$registry_name" -o json > "$WORKSPACE/registry.json"; then
            echo "::error::cannot read registry '$registry_name' bound to service $SERVICE_NAME (needs registry.read)"
            exit 1
          fi
          registry_type=$(jq -r '.definition.type // ""' "$WORKSPACE/registry.json")
          case "$registry_type" in
            elasticContainerRegistry) registry_provider=ecr ;;
            googleArtifactRegistry) registry_provider=gar ;;
            *)
              echo "::error::registry '$registry_name' (type '$registry_type') is not a Ryvn-managed ECR or Google Artifact Registry; ryvn-build-action cannot publish to it"
              exit 1
              ;;
          esac
        fi

        # Extract and validate working directory
        working_dir=$(jq -r '.definition.build.workingDir' "$service_json")
        if ([ "$working_dir" = "null" ] || [ -z "$working_dir" ]) && [ "$container_build" = "true" ]; then
          echo "Error: working_dir not found in service definition"
          exit 1
        fi

        # Extract build command and buildpack for nixpacks first
        build_command=$(jq -r '.definition.build.command // ""' "$service_json")
        buildpack=$(jq -r '.definition.build.buildpack' "$service_json")

        # Extract and validate dockerfile path (only required if not using buildpack/nixpacks)
        dockerfile_path=$(jq -r '.definition.build.dockerfilePath' "$service_json")
        if ([ "$dockerfile_path" = "null" ] || [ -z "$dockerfile_path" ]) && [ "$container_build" = "true" ] && [ "$USE_NIXPACKS" != "true" ] && [ "$buildpack" != "nixpack" ]; then
          echo "Error: dockerfile_path not found in service definition"
          exit 1
        fi

        # Check if service should use nixpacks
        use_nixpacks_from_service="false"
        if [ "$buildpack" = "nixpack" ]; then
          use_nixpacks_from_service="true"
        fi

        # Check if dockerBuildArgs exists and is not null
        if [ "$(jq -r '.definition.build.dockerBuildArgs != null' "$service_json")" = "true" ]; then
          # Extract and convert build args to multi-line format
          service_build_args=$(jq -r '.definition.build.dockerBuildArgs | to_entries | map("\(.key)=\(.value)") | join("\n")' "$service_json")

          # Resolve ${VAR} references in build args from environment variables
          service_build_args=$(echo "$service_build_args" | envsubst)

          # If workflow build args are not specified, use service build args
          if [ -z "$INPUT_BUILD_ARGS" ]; then
            echo "Using build args from service definition"
            echo "build_args<<EOF" >> $GITHUB_OUTPUT
            echo "$service_build_args" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "Using build args from workflow input"
            echo "build_args=$INPUT_BUILD_ARGS" >> $GITHUB_OUTPUT
          fi
        else
          echo "build_args=$INPUT_BUILD_ARGS" >> $GITHUB_OUTPUT
        fi

        # Extract and validate helm chart path
        helm_chart_path=$(jq -r '.definition.build.chartPath' "$service_json")
        if ([ "$helm_chart_path" = "null" ] || [ -z "$helm_chart_path" ]) && [ "$service_type" = "helm-chart.v1" ]; then
          echo "Error: chartPath not found in service definition"
          exit 1
        fi

        # Extract and validate orgId
        org_id=$(jq -r '.orgId' "$service_json")
        if [ "$org_id" = "null" ] || [ -z "$org_id" ]; then
          echo "Error: orgId not found in service definition"
          exit 1
        fi

        # Legacy ECR publishing assumes the org's GitHub Actions role.
        role_arn=""
        region=""
        if [ "$registry_provider" = "ecr" ]; then
          role_arn="arn:aws:iam::703671917981:role/${org_id}-github-actions"
          region="us-east-1"
        fi

        # Set outputs
        echo "service_type=$service_type" >> $GITHUB_OUTPUT
        echo "container_build=$container_build" >> $GITHUB_OUTPUT
        echo "image_ref=$image_ref" >> $GITHUB_OUTPUT
        echo "registry_provider=$registry_provider" >> $GITHUB_OUTPUT
        echo "helm_chart_path=$helm_chart_path" >> $GITHUB_OUTPUT
        echo "working_dir=$working_dir" >> $GITHUB_OUTPUT
        echo "dockerfile_path=$dockerfile_path" >> $GITHUB_OUTPUT
        echo "role_arn=$role_arn" >> $GITHUB_OUTPUT
        echo "region=$region" >> $GITHUB_OUTPUT
        echo "build_command=$build_command" >> $GITHUB_OUTPUT
        echo "use_nixpacks_from_service=$use_nixpacks_from_service" >> $GITHUB_OUTPUT

    - name: Configure AWS credentials
      if: inputs.build_only != 'true' && steps.service.outputs.registry_provider == 'ecr'
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ steps.service.outputs.role_arn }}
        aws-region: ${{ steps.service.outputs.region }}

    # The ECR login lands in the runner's Docker config; ryvn push chart is
    # pointed at that same file, so Helm charts need no helm registry login.
    - name: Login to Amazon ECR
      if: inputs.build_only != 'true' && steps.service.outputs.registry_provider == 'ecr'
      uses: aws-actions/amazon-ecr-login@v2

    # Docker Image Steps
    - name: Extract Docker metadata
      if: steps.service.outputs.container_build == 'true'
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ steps.service.outputs.image_ref }}
        tags: |
          type=semver,pattern={{version}},value=${{ inputs.version }}
          type=sha
          type=ref,event=pr

    # Standard Docker Build Steps - only run if not using Nixpacks. The
    # builder is created in the caller's DOCKER_CONFIG before the GAR login
    # switches to a disposable copy (which pins BUILDX_CONFIG back to the
    # caller's), so the setup action's post-job cleanup still finds it.
    - name: Set up Docker Buildx (Blacksmith)
      if: steps.service.outputs.container_build == 'true' && startsWith(runner.name, 'blacksmith') && inputs.use_nixpacks != 'true' && steps.service.outputs.use_nixpacks_from_service != 'true'
      uses: useblacksmith/setup-docker-builder@v2
      with:
        cache-key: ${{ inputs.service_name }}

    - name: Set up Docker Buildx (Docker)
      if: steps.service.outputs.container_build == 'true' && !startsWith(runner.name, 'blacksmith') && inputs.use_nixpacks != 'true' && steps.service.outputs.use_nixpacks_from_service != 'true'
      uses: docker/setup-buildx-action@v4
      with:
        version: latest
        endpoint: ${{ inputs.buildx_endpoint }}
        driver: ${{ inputs.buildx_driver }}

    # Google Artifact Registry: ryvn create registry-config mints a one-hour
    # credential right before the build and writes a disposable Docker/Helm
    # config in the workspace (seeded from the caller's config, credential
    # helpers and other registries untouched). Its env is exported for the
    # build, push, inspection and chart steps; the cleanup step deletes it and
    # restores the previous values. Builds that outlive the credential fail at
    # push time; see README.
    - name: Login to Google Artifact Registry
      if: inputs.build_only != 'true' && steps.service.outputs.registry_provider == 'gar'
      shell: bash
      env:
        RYVN_CLIENT_ID: ${{ inputs.ryvn_client_id }}
        RYVN_CLIENT_SECRET: ${{ inputs.ryvn_client_secret }}
        RYVN_API_URL: ${{ inputs.ryvn_api_url || env.RYVN_API_URL }}
        RYVN_AUTH_URL: ${{ inputs.ryvn_auth_url || env.RYVN_AUTH_URL }}
        RYVN_ORG_ID: ${{ inputs.ryvn_org_id || env.RYVN_ORG_ID }}
        RYVN_PROJECT_ID: ${{ inputs.ryvn_project_id || env.RYVN_PROJECT_ID }}
        SERVICE_NAME: ${{ inputs.service_name }}
        WORKSPACE: ${{ steps.workspace.outputs.dir }}
      run: |
        set -euo pipefail
        ryvn create registry-config "$WORKSPACE/registry-config" --service "$SERVICE_NAME" -o json > "$WORKSPACE/registry-config.json"
        {
          echo "RYVN_REGISTRY_CONFIG_ACTIVE=true"
          echo "RYVN_ORIGINAL_DOCKER_CONFIG=${DOCKER_CONFIG-}"
          echo "RYVN_ORIGINAL_HELM_REGISTRY_CONFIG=${HELM_REGISTRY_CONFIG-}"
          echo "RYVN_ORIGINAL_BUILDX_CONFIG=${BUILDX_CONFIG-}"
          echo "RYVN_ORIGINAL_DOCKER_CERT_PATH=${DOCKER_CERT_PATH-}"
          jq -r '.env | to_entries[] | "\(.key)=\(.value)"' "$WORKSPACE/registry-config.json"
        } >> "$GITHUB_ENV"
        jq -r '"Logged in to \(.server) as \(.username) until \(.expiresAt)"' "$WORKSPACE/registry-config.json"

    # Nixpacks Build and Push (with build command)
    - name: Build and push with Nixpacks (with build command)
      if: steps.service.outputs.container_build == 'true' && (inputs.use_nixpacks == 'true' || steps.service.outputs.use_nixpacks_from_service == 'true') && steps.service.outputs.build_command != ''
      uses: iloveitaly/github-action-nixpacks@main
      with:
        context: ${{ steps.service.outputs.working_dir }}
        push: ${{ inputs.build_only != 'true' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        platforms: ${{ inputs.platforms }}
        pkgs: ${{ inputs.nixpacks_pkgs }}
        apt: ${{ inputs.nixpacks_apt }}
        cache: ${{ inputs.disable_cache == 'true' && 'false' || inputs.nixpacks_cache }}
        cache_tag: ${{ steps.service.outputs.image_ref }}:cache
        env: NIXPACKS_BUILD_CMD="${{ steps.service.outputs.build_command }}"

    # Nixpacks Build and Push (without build command)
    - name: Build and push with Nixpacks (without build command)
      if: steps.service.outputs.container_build == 'true' && (inputs.use_nixpacks == 'true' || steps.service.outputs.use_nixpacks_from_service == 'true') && steps.service.outputs.build_command == ''
      uses: iloveitaly/github-action-nixpacks@main
      with:
        context: ${{ steps.service.outputs.working_dir }}
        push: ${{ inputs.build_only != 'true' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        platforms: ${{ inputs.platforms }}
        pkgs: ${{ inputs.nixpacks_pkgs }}
        apt: ${{ inputs.nixpacks_apt }}
        cache: ${{ inputs.disable_cache == 'true' && 'false' || inputs.nixpacks_cache }}
        cache_tag: ${{ steps.service.outputs.image_ref }}:cache
        env: ${{ steps.service.outputs.build_args }}

    - name: Determine Docker output mode
      id: docker_output
      if: steps.service.outputs.container_build == 'true' && inputs.use_nixpacks != 'true' && steps.service.outputs.use_nixpacks_from_service != 'true'
      shell: bash
      env:
        BUILD_ONLY: ${{ inputs.build_only }}
        PLATFORMS: ${{ inputs.platforms }}
      run: |
        set -euo pipefail

        platform_count="$(
          printf '%s\n' "$PLATFORMS" |
            tr ',' '\n' |
            sed '/^[[:space:]]*$/d' |
            wc -l |
            tr -d '[:space:]'
        )"

        load_image=false
        if [[ "$BUILD_ONLY" == "true" && "$platform_count" == "1" ]]; then
          load_image=true
        fi

        echo "load_image=$load_image" >> "$GITHUB_OUTPUT"

    - name: Build and push Docker image (Blacksmith)
      id: build_blacksmith
      if: steps.service.outputs.container_build == 'true' && startsWith(runner.name, 'blacksmith') && inputs.use_nixpacks != 'true' && steps.service.outputs.use_nixpacks_from_service != 'true'
      uses: useblacksmith/build-push-action@v2
      with:
        context: ${{ steps.service.outputs.working_dir }}
        file: ${{ steps.service.outputs.dockerfile_path }}
        push: ${{ inputs.build_only != 'true' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: ${{ steps.service.outputs.build_args }}
        secrets: ${{ inputs.build_secrets }}
        platforms: ${{ inputs.platforms }}
        load: ${{ steps.docker_output.outputs.load_image }}

    - name: Build and push Docker image (Docker)
      id: build_docker
      if: steps.service.outputs.container_build == 'true' && !startsWith(runner.name, 'blacksmith') && inputs.use_nixpacks != 'true' && steps.service.outputs.use_nixpacks_from_service != 'true'
      uses: docker/build-push-action@v7
      with:
        context: ${{ steps.service.outputs.working_dir }}
        file: ${{ steps.service.outputs.dockerfile_path }}
        push: ${{ inputs.build_only != 'true' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: ${{ steps.service.outputs.build_args }}
        secrets: ${{ inputs.build_secrets }}
        cache-from: ${{ inputs.disable_cache != 'true' && format('type=gha,scope={0}', inputs.service_name) || '' }}
        cache-to: ${{ inputs.disable_cache != 'true' && format('type=gha,mode=max,scope={0}', inputs.service_name) || '' }}
        platforms: ${{ inputs.platforms }}
        load: ${{ steps.docker_output.outputs.load_image }}

    # Helm Chart Steps: packaging is local (no credential); the push resolves
    # the service's chart destination and authenticates from the GAR
    # registry-config env or, on ECR, the Docker config the ECR login wrote
    # (selected explicitly so a stale HELM_REGISTRY_CONFIG cannot shadow it).
    - name: Package Helm Chart
      id: helm_package
      if: steps.service.outputs.service_type == 'helm-chart.v1'
      shell: bash
      env:
        CHART_PATH: ${{ steps.service.outputs.helm_chart_path }}
        VERSION: ${{ inputs.version }}
        WORKSPACE: ${{ steps.workspace.outputs.dir }}
      run: |
        set -euo pipefail
        ryvn package chart "$CHART_PATH" --version "$VERSION" --destination "$WORKSPACE/chart" -o json > "$WORKSPACE/chart-package.json"
        echo "chart_package=$(jq -r '.path' "$WORKSPACE/chart-package.json")" >> "$GITHUB_OUTPUT"

    - name: Push Helm Chart to Registry
      if: steps.service.outputs.service_type == 'helm-chart.v1' && inputs.build_only != 'true'
      shell: bash
      env:
        RYVN_CLIENT_ID: ${{ inputs.ryvn_client_id }}
        RYVN_CLIENT_SECRET: ${{ inputs.ryvn_client_secret }}
        RYVN_API_URL: ${{ inputs.ryvn_api_url || env.RYVN_API_URL }}
        RYVN_AUTH_URL: ${{ inputs.ryvn_auth_url || env.RYVN_AUTH_URL }}
        RYVN_ORG_ID: ${{ inputs.ryvn_org_id || env.RYVN_ORG_ID }}
        RYVN_PROJECT_ID: ${{ inputs.ryvn_project_id || env.RYVN_PROJECT_ID }}
        SERVICE_NAME: ${{ inputs.service_name }}
        CHART_PACKAGE: ${{ steps.helm_package.outputs.chart_package }}
        REGISTRY_PROVIDER: ${{ steps.service.outputs.registry_provider }}
        WORKSPACE: ${{ steps.workspace.outputs.dir }}
      run: |
        set -euo pipefail
        args=(push chart "$CHART_PACKAGE" --service "$SERVICE_NAME" -o artifact)
        if [[ "$REGISTRY_PROVIDER" == "ecr" ]]; then
          args+=(--registry-config "${DOCKER_CONFIG:-$HOME/.docker}/config.json")
        fi
        ryvn "${args[@]}" > "$WORKSPACE/artifacts.json"

    # Image metadata is best effort, as before: an unreadable image keeps the
    # repository/tag artifact and reports the cause instead of failing the
    # build (the push above has already succeeded or failed on its own).
    - name: Describe container image
      if: steps.service.outputs.container_build == 'true'
      shell: bash
      env:
        IMAGE_REFERENCE: ${{ steps.service.outputs.image_ref }}:${{ steps.meta.outputs.version }}
        SERVICE_NAME: ${{ inputs.service_name }}
        BUILD_ONLY: ${{ inputs.build_only }}
        DIGEST: ${{ steps.build_docker.outputs.digest || steps.build_blacksmith.outputs.digest }}
        WORKSPACE: ${{ steps.workspace.outputs.dir }}
      run: |
        set -euo pipefail
        args=(describe image "$IMAGE_REFERENCE" --service "$SERVICE_NAME" --allow-missing -o artifact)
        if [[ "$BUILD_ONLY" == "true" ]]; then
          # Nothing was pushed: read the daemon (no registry, no credential).
          args+=(--local)
        elif [[ -n "$DIGEST" ]]; then
          args+=(--digest "$DIGEST")
        fi
        ryvn "${args[@]}" > "$WORKSPACE/artifacts.json"

    # One service produces at most one artifact array (push chart or describe
    # image, never both); Helm build_only produces none.
    - name: Emit build artifacts
      id: artifacts
      shell: bash
      env:
        WORKSPACE: ${{ steps.workspace.outputs.dir }}
      run: |
        set -euo pipefail
        artifacts="[]"
        if [[ -s "$WORKSPACE/artifacts.json" ]]; then
          artifacts="$(jq -c . "$WORKSPACE/artifacts.json")"
        fi
        echo "Build artifacts: $artifacts"
        {
          echo "build_artifacts<<RYVN_ARTIFACTS_EOF"
          echo "$artifacts"
          echo "RYVN_ARTIFACTS_EOF"
        } >> "$GITHUB_OUTPUT"

    # ryvn delete registry-config is idempotent and only removes the directory
    # it owns (ownership manifest), never the caller's Docker/Helm config or
    # buildx state. The environment the login step replaced is restored even
    # when that deletion fails (the failure is still reported), then the
    # invocation's workspace is removed.
    - name: Remove Google Artifact Registry login and workspace
      if: always() && steps.workspace.outputs.dir != ''
      shell: bash
      env:
        WORKSPACE: ${{ steps.workspace.outputs.dir }}
        REGISTRY_PROVIDER: ${{ steps.service.outputs.registry_provider }}
      run: |
        set +e -uo pipefail
        status=0
        if [[ "$REGISTRY_PROVIDER" == "gar" ]]; then
          ryvn delete registry-config "$WORKSPACE/registry-config" || status=$?
        fi
        if [[ "${RYVN_REGISTRY_CONFIG_ACTIVE-}" == "true" ]]; then
          {
            echo "RYVN_REGISTRY_CONFIG_ACTIVE="
            echo "DOCKER_CONFIG=${RYVN_ORIGINAL_DOCKER_CONFIG-}"
            echo "HELM_REGISTRY_CONFIG=${RYVN_ORIGINAL_HELM_REGISTRY_CONFIG-}"
            echo "BUILDX_CONFIG=${RYVN_ORIGINAL_BUILDX_CONFIG-}"
            echo "DOCKER_CERT_PATH=${RYVN_ORIGINAL_DOCKER_CERT_PATH-}"
          } >> "$GITHUB_ENV" || status=$?
        fi
        rm -rf "$WORKSPACE" || status=$?
        exit "$status"

branding:
  icon: "package"
  color: "blue"
