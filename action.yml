name: "Build and Push to Registry"
description: "Builds and pushes Docker images or Helm charts to the service's registry"

inputs:
  service_name:
    description: "Name of the service"
    required: true
  version:
    description: "Semantic version to tag the image/chart with"
    required: true
  build_only:
    description: "Build only, don't push to registry"
    required: false
    default: "false"
  ryvn_client_id:
    description: "Ryvn Client ID for static-credential authentication. Not needed when the job has `id-token: write` and the Ryvn org has keyless CI auth enabled; the CLI then authenticates with the job's GitHub OIDC token."
    required: false
    default: ""
  ryvn_client_secret:
    description: "Ryvn Client Secret for static-credential authentication (see ryvn_client_id)"
    required: false
    default: ""
  ryvn_org_id:
    description: "Ryvn organization ID. Only needed when more than one Ryvn organization trusts this repository (optional)"
    required: false
    default: ""
  ryvn_cli_version:
    description: "Ryvn CLI release to install; must be v1.294.0 or newer (all-provider registry-config, repository preflight, chart and image commands, artifact digests). Defaults to v1.294.0 (optional)"
    required: false
    default: ""
  ryvn_api_url:
    description: "Ryvn API URL for self-hosted or dev instances (optional)"
    required: false
  ryvn_auth_url:
    description: "Ryvn Auth URL for self-hosted or dev instances (optional)"
    required: false
  ryvn_project_id:
    description: "Ryvn Project ID for local dev setups (optional)"
    required: false
  build_args:
    description: "Build arguments to pass to the Docker build"
    required: false
  images:
    description: "JSON map of named Dockerfile image targets built next to a Helm chart into the service's managed GAR repository"
    required: false
    default: "{}"
  platforms:
    description: "List of target platforms for build"
    required: false
    default: "linux/amd64"
  use_nixpacks:
    description: "Use Nixpacks to build Docker images instead of Dockerfile"
    required: false
    default: "false"
  nixpacks_pkgs:
    description: "Additional Nix packages to install in the environment"
    required: false
    default: ""
  nixpacks_apt:
    description: "Additional Apt packages to install in the environment"
    required: false
    default: ""
  nixpacks_cache:
    description: "Use the Nixpacks build cache"
    required: false
    default: "true"
  buildx_endpoint:
    description: "Docker Buildx endpoint for remote driver"
    required: false
    default: ""
  buildx_driver:
    description: "Docker Buildx driver type"
    required: false
    default: ""
  disable_cache:
    description: "Disable all caching (GitHub Actions cache and build cache)"
    required: false
    default: "false"
  build_secrets:
    description: "Docker BuildKit secrets (KEY=VALUE per line). Mounted via --secret so they don't leak into image layers. Users access them with RUN --mount=type=secret,id=KEY in their Dockerfile."
    required: false
    default: ""

outputs:
  build_artifacts:
    description: "JSON array of artifacts built by this action"
    value: ${{ steps.artifacts.outputs.build_artifacts }}
  release_file:
    description: "Generated release artifact inventory for helm-chart services; empty for container services and build-only runs. Pass it to `ryvn create release -f`."
    value: ${{ steps.artifacts.outputs.release_file }}

runs:
  using: "composite"
  steps:
    # Registry login, chart packaging/publishing and image inspection are CLI
    # commands, so the default is the oldest release that carries them. An
    # older explicit pin fails at the first missing command.
    - name: Install Ryvn CLI
      uses: ryvn-technologies/install-ryvn-cli@v1.0.0
      env:
        RYVN_CLI_VERSION: ${{ inputs.ryvn_cli_version || 'v1.294.0' }}

    # One private directory per invocation for every transient file (service
    # and registry metadata, registry config, chart package, artifacts) so
    # several invocations in one job never see each other's state and nothing
    # is written into the checkout. Removed by the cleanup step.
    - name: Create build workspace
      id: workspace
      shell: bash
      run: |
        set -euo pipefail
        echo "dir=$(mktemp -d "$RUNNER_TEMP/ryvn-build.XXXXXX")" >> "$GITHUB_OUTPUT"

    - name: Print Runner Info
      shell: bash
      run: |
        echo "Runner name: ${{ runner.name }}"
        echo "Runner OS: ${{ runner.os }}"
        echo "Runner architecture: ${{ runner.arch }}"
        echo "Runner labels: ${{ runner.labels }}"

    - name: Get Service and Registry Details from Ryvn API
      id: service
      shell: bash
      env:
        # Empty when the caller relies on keyless CI auth: the CLI exchanges the
        # job's GitHub OIDC token itself and uses these only as the documented
        # fallback. Hub inputs override the job environment for this step only.
        RYVN_CLIENT_ID: ${{ inputs.ryvn_client_id }}
        RYVN_CLIENT_SECRET: ${{ inputs.ryvn_client_secret }}
        RYVN_API_URL: ${{ inputs.ryvn_api_url || env.RYVN_API_URL }}
        RYVN_AUTH_URL: ${{ inputs.ryvn_auth_url || env.RYVN_AUTH_URL }}
        RYVN_ORG_ID: ${{ inputs.ryvn_org_id || env.RYVN_ORG_ID }}
        RYVN_PROJECT_ID: ${{ inputs.ryvn_project_id || env.RYVN_PROJECT_ID }}
        SERVICE_NAME: ${{ inputs.service_name }}
        BUILD_ONLY: ${{ inputs.build_only }}
        USE_NIXPACKS: ${{ inputs.use_nixpacks }}
        INPUT_BUILD_ARGS: ${{ inputs.build_args }}
        WORKSPACE: ${{ steps.workspace.outputs.dir }}
      run: |
        set -euo pipefail
        service_json="$WORKSPACE/service.json"
        ryvn get service "$SERVICE_NAME" -o json > "$service_json"
        echo "Service details: $(cat "$service_json")"

        service_type=$(jq -r '.definition.type' "$service_json")
        if [ "$service_type" = "null" ] || [ -z "$service_type" ]; then
          echo "Error: service type not found in service definition"
          exit 1
        fi

        container_build=false
        case "$service_type" in
          web-server.v1|job.v1) container_build=true ;;
        esac
        image_ref=""
        if [ "$container_build" = "true" ]; then
          image_ref=$(jq -r '.definition.image // ""' "$service_json")
          if [ -z "$image_ref" ]; then
            echo "Error: $service_type service has no image publish destination"
            exit 1
          fi
        fi

        # The registry the service is bound to decides how the runner logs in.
        # Only the managed "ryvn-registry" when it is ECR keeps the AWS role +
        # amazon-ecr-login path; every other registry — managed GAR, customer
        # ECR, generic OCI — logs in through a brokered registry config.
        # Destinations are resolved by the CLI at push time. build_only needs
        # no registry. Customer bindings are never read here — only the
        # managed registry's type is fetched, which needs registry.read.
        registry_provider=""
        if [ "$BUILD_ONLY" != "true" ] && { [ "$container_build" = "true" ] || [ "$service_type" = "helm-chart.v1" ]; }; then
          registry_name=$(jq -r '.definition.registry // "ryvn-registry"' "$service_json")
          if [ "$registry_name" = "ryvn-registry" ]; then
            # Only the managed registry needs its type resolved: ECR versus
            # GAR decides whether the AWS role + amazon-ecr-login path runs.
            # Requires registry.read on the managed registry.
            if ! ryvn get registry "$registry_name" -o json > "$WORKSPACE/registry.json"; then
              echo "::error::cannot read managed registry 'ryvn-registry' bound to service $SERVICE_NAME (needs registry.read)"
              exit 1
            fi
            registry_type=$(jq -r '.definition.type // ""' "$WORKSPACE/registry.json")
            if [ "$registry_type" = "elasticContainerRegistry" ]; then
              registry_provider=ecr
            else
              registry_provider=brokered
            fi
          else
            registry_provider=brokered
          fi
        fi

        # Extract and validate working directory
        working_dir=$(jq -r '.definition.build.workingDir' "$service_json")
        if ([ "$working_dir" = "null" ] || [ -z "$working_dir" ]) && [ "$container_build" = "true" ]; then
          echo "Error: working_dir not found in service definition"
          exit 1
        fi

        # Extract build command and buildpack for nixpacks first
        build_command=$(jq -r '.definition.build.command // ""' "$service_json")
        buildpack=$(jq -r '.definition.build.buildpack' "$service_json")

        # Extract and validate dockerfile path (only required if not using buildpack/nixpacks)
        dockerfile_path=$(jq -r '.definition.build.dockerfilePath' "$service_json")
        if ([ "$dockerfile_path" = "null" ] || [ -z "$dockerfile_path" ]) && [ "$container_build" = "true" ] && [ "$USE_NIXPACKS" != "true" ] && [ "$buildpack" != "nixpack" ]; then
          echo "Error: dockerfile_path not found in service definition"
          exit 1
        fi

        # Check if service should use nixpacks
        use_nixpacks_from_service="false"
        if [ "$buildpack" = "nixpack" ]; then
          use_nixpacks_from_service="true"
        fi

        # Check if dockerBuildArgs exists and is not null
        if [ "$(jq -r '.definition.build.dockerBuildArgs != null' "$service_json")" = "true" ]; then
          # Extract and convert build args to multi-line format
          service_build_args=$(jq -r '.definition.build.dockerBuildArgs | to_entries | map("\(.key)=\(.value)") | join("\n")' "$service_json")

          # Resolve ${VAR} references in build args from environment variables
          service_build_args=$(echo "$service_build_args" | envsubst)

          # If workflow build args are not specified, use service build args
          if [ -z "$INPUT_BUILD_ARGS" ]; then
            echo "Using build args from service definition"
            echo "build_args<<EOF" >> $GITHUB_OUTPUT
            echo "$service_build_args" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "Using build args from workflow input"
            echo "build_args=$INPUT_BUILD_ARGS" >> $GITHUB_OUTPUT
          fi
        else
          echo "build_args=$INPUT_BUILD_ARGS" >> $GITHUB_OUTPUT
        fi

        # Extract and validate helm chart path
        helm_chart_path=$(jq -r '.definition.build.chartPath' "$service_json")
        if ([ "$helm_chart_path" = "null" ] || [ -z "$helm_chart_path" ]) && [ "$service_type" = "helm-chart.v1" ]; then
          echo "Error: chartPath not found in service definition"
          exit 1
        fi

        # Extract and validate orgId
        org_id=$(jq -r '.orgId' "$service_json")
        if [ "$org_id" = "null" ] || [ -z "$org_id" ]; then
          echo "Error: orgId not found in service definition"
          exit 1
        fi

        # Legacy ECR publishing assumes the org's GitHub Actions role.
        role_arn=""
        region=""
        if [ "$registry_provider" = "ecr" ]; then
          role_arn="arn:aws:iam::703671917981:role/${org_id}-github-actions"
          region="us-east-1"
        fi

        # Set outputs
        echo "service_type=$service_type" >> $GITHUB_OUTPUT
        echo "container_build=$container_build" >> $GITHUB_OUTPUT
        echo "image_ref=$image_ref" >> $GITHUB_OUTPUT
        echo "registry_provider=$registry_provider" >> $GITHUB_OUTPUT
        echo "helm_chart_path=$helm_chart_path" >> $GITHUB_OUTPUT
        echo "working_dir=$working_dir" >> $GITHUB_OUTPUT
        echo "dockerfile_path=$dockerfile_path" >> $GITHUB_OUTPUT
        echo "role_arn=$role_arn" >> $GITHUB_OUTPUT
        echo "region=$region" >> $GITHUB_OUTPUT
        echo "build_command=$build_command" >> $GITHUB_OUTPUT
        echo "use_nixpacks_from_service=$use_nixpacks_from_service" >> $GITHUB_OUTPUT

    - name: Resolve image targets
      id: images
      shell: bash
      env:
        IMAGES: ${{ inputs.images }}
        SERVICE_NAME: ${{ inputs.service_name }}
        VERSION: ${{ inputs.version }}
        BUILD_ONLY: ${{ inputs.build_only }}
        RYVN_CLI_VERSION_PIN: ${{ inputs.ryvn_cli_version }}
        WORKSPACE: ${{ steps.workspace.outputs.dir }}
        SERVICE_TYPE: ${{ steps.service.outputs.service_type }}
        CONTAINER_BUILD: ${{ steps.service.outputs.container_build }}
        REGISTRY_PROVIDER: ${{ steps.service.outputs.registry_provider }}
        CHECKOUT: ${{ github.workspace }}
        BUILD_ARGS: ${{ inputs.build_args }}
        PLATFORMS: ${{ inputs.platforms }}
      run: |
        set -euo pipefail
        if [[ -z "${IMAGES//[[:space:]]/}" || "${IMAGES//[[:space:]]/}" == "{}" ]]; then
          echo "enabled=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        command -v python3 >/dev/null 2>&1 || {
          echo "::error::python3 is required when named image targets are enabled"
          exit 1
        }
        python3 - <<'PY'
        import json
        import os
        import re
        import sys

        def fail(message):
            print(f"::error::{message}", file=sys.stderr)
            raise SystemExit(1)

        class RejectDuplicate(dict):
            pass

        def pairs(pairs):
            result = {}
            for key, value in pairs:
                if key in result:
                    fail(f"duplicate key {key!r}")
                result[key] = value
            return result

        try:
            data = json.loads(os.environ["IMAGES"], object_pairs_hook=pairs)
        except json.JSONDecodeError as exc:
            fail(f"invalid images JSON: {exc}")
        if not isinstance(data, dict):
            fail("images must be a JSON object")
        if os.environ.get("SERVICE_TYPE") != "helm-chart.v1":
            fail("named images require a helm-chart.v1 service")
        if os.environ.get("CONTAINER_BUILD") == "true":
            fail("named images cannot be used with a container service")
        if os.environ.get("BUILD_ONLY") != "true" and os.environ.get("REGISTRY_PROVIDER") != "brokered":
            fail("named images require brokered registry authentication")
        service_name = os.environ["SERVICE_NAME"]
        if not re.fullmatch(r"[a-z][a-z0-9-]{0,62}", service_name):
            fail("invalid service name")
        for name, target in data.items():
            if not isinstance(name, str) or not re.fullmatch(r"[a-z][a-z0-9-]{0,62}", name):
                fail(f"invalid image target name {name!r}")
            if name == service_name:
                fail(f"image target name {name!r} must not equal the service name")
            if not isinstance(target, dict) or set(target) != {"build"}:
                fail(f"image target {name!r} must contain only build")
            build = target["build"]
            if not isinstance(build, dict):
                fail(f"image target {name!r} build must be an object")
            unknown = set(build) - {"workingDir", "dockerfilePath", "dockerBuildArgs"}
            if unknown:
                fail(f"image target {name!r} has unknown build field {sorted(unknown)[0]!r}")
            for field in ("workingDir", "dockerfilePath"):
                if not isinstance(build.get(field), str) or not build[field]:
                    fail(f"image target {name!r} requires non-empty string {field}")
            args = build.get("dockerBuildArgs", {})
            if not isinstance(args, dict) or any(not isinstance(k, str) or not isinstance(v, str) for k, v in args.items()):
                fail(f"image target {name!r} dockerBuildArgs must be a string map")

        service_path = os.path.join(os.environ["WORKSPACE"], "service.json")
        try:
            with open(service_path, encoding="utf-8") as stream:
                service = json.load(stream)
        except (OSError, json.JSONDecodeError) as exc:
            fail(f"cannot read service metadata: {exc}")
        definition = service.get("definition", {})
        if definition.get("registry", "ryvn-registry") != "ryvn-registry":
            fail("named images require registry ryvn-registry")
        if isinstance(definition.get("repoURL"), str) and definition["repoURL"]:
            fail("named images require the managed ryvn-registry chart destination; remove repoURL")
        match = re.fullmatch(r"([^/?#]+)/([^/?#]+)/charts", definition.get("chartRepository", ""))
        if not match:
            fail("service chartRepository must be the managed GAR <project>/<repository>/charts path")
        project, repository = match.groups()
        host = ""
        if os.environ.get("BUILD_ONLY") != "true":
            registry_path = os.path.join(os.environ["WORKSPACE"], "registry.json")
            if not os.path.isfile(registry_path):
                fail("registry.json is required for named image publishing")
            try:
                with open(registry_path, encoding="utf-8") as stream:
                    registry = json.load(stream).get("definition", {})
            except (OSError, json.JSONDecodeError) as exc:
                fail(f"cannot read registry metadata: {exc}")
            if registry.get("type") != "googleArtifactRegistry":
                fail("named images require a googleArtifactRegistry registry")
            if not re.fullmatch(r"[a-z0-9-]+-docker\.pkg\.dev", registry.get("url", "")):
                fail("registry URL is not a valid GAR host")
            if registry.get("projectId") != project:
                fail("registry projectId does not match the service chartRepository")
            host = registry["url"]

        pin = os.environ.get("RYVN_CLI_VERSION_PIN", "")
        if pin:
            version = pin.lstrip("v").split(".")
            if len(version) != 3 or any(not part.isdigit() for part in version):
                fail("ryvn_cli_version must be MAJOR.MINOR.PATCH")
            if tuple(map(int, version)) < (1, 294, 0):
                fail("named images need ryvn CLI v1.294.0 or newer")
        root = os.path.realpath(os.environ["CHECKOUT"])
        action_args = {}
        if os.environ.get("BUILD_ARGS", ""):
            for line in os.environ["BUILD_ARGS"].splitlines():
                if "=" not in line:
                    fail("build_args must contain KEY=VALUE lines")
                key, value = line.split("=", 1)
                action_args[key] = value

        def expand(value):
            return re.sub(
                r"\$\{([A-Za-z_][A-Za-z0-9_]*)\}|\$([A-Za-z_][A-Za-z0-9_]*)",
                lambda match: os.environ.get(match.group(1) or match.group(2), ""),
                value,
            )

        targets = []
        for name in sorted(data):
            build = data[name]["build"]
            context = os.path.realpath(os.path.join(root, build["workingDir"]))
            dockerfile = os.path.realpath(os.path.join(root, build["dockerfilePath"]))
            for label, path in (("workingDir", context), ("dockerfilePath", dockerfile)):
                if not (path == root or path.startswith(root + os.sep)):
                    fail(f"image target {name!r} {label} resolves outside the checkout")
            if not os.path.isdir(context):
                fail(f"image target {name!r} context does not exist")
            if not os.path.isfile(dockerfile):
                fail(f"image target {name!r} dockerfile does not exist")
            args = action_args or {key: expand(value) for key, value in build.get("dockerBuildArgs", {}).items()}
            targets.append({
                "name": name,
                "target": f"img-{name}",
                "context": context,
                "dockerfile": dockerfile,
                "args": args,
                "repository": f"{host}/{project}/{repository}/images/{name}" if host else "",
            })
        output = {
            "tag": os.environ["VERSION"].replace("+", "_"),
            "targets": targets,
        }
        os.makedirs(os.environ["WORKSPACE"], exist_ok=True)
        with open(os.path.join(os.environ["WORKSPACE"], "images.json"), "w", encoding="utf-8") as stream:
            json.dump(output, stream, separators=(",", ":"))
        with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
            stream.write("enabled=true\n")
            stream.write(f"count={len(targets)}\n")
            stream.write(f"tag={output['tag']}\n")
            stream.write(f"names={' '.join(target['name'] for target in targets)}\n")
        PY

    - name: Configure AWS credentials
      if: inputs.build_only != 'true' && steps.service.outputs.registry_provider == 'ecr'
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ steps.service.outputs.role_arn }}
        aws-region: ${{ steps.service.outputs.region }}

    # The ECR login lands in the runner's Docker config; ryvn push chart is
    # pointed at that same file, so Helm charts need no helm registry login.
    - name: Login to Amazon ECR
      if: inputs.build_only != 'true' && steps.service.outputs.registry_provider == 'ecr'
      uses: aws-actions/amazon-ecr-login@v2

    # Docker Image Steps
    - name: Extract Docker metadata
      if: steps.service.outputs.container_build == 'true'
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ steps.service.outputs.image_ref }}
        tags: |
          type=semver,pattern={{version}},value=${{ inputs.version }}
          type=sha
          type=ref,event=pr

    # Standard Docker Build Steps - only run if not using Nixpacks. The
    # builder is created in the caller's DOCKER_CONFIG before the GAR login
    # switches to a disposable copy (which pins BUILDX_CONFIG back to the
    # caller's), so the setup action's post-job cleanup still finds it.
    - name: Set up Docker Buildx (Blacksmith)
      if: (steps.service.outputs.container_build == 'true' && startsWith(runner.name, 'blacksmith') && inputs.use_nixpacks != 'true' && steps.service.outputs.use_nixpacks_from_service != 'true') || (steps.images.outputs.enabled == 'true' && startsWith(runner.name, 'blacksmith'))
      uses: useblacksmith/setup-docker-builder@v2
      with:
        cache-key: ${{ inputs.service_name }}

    - name: Set up Docker Buildx (Docker)
      if: (steps.service.outputs.container_build == 'true' && !startsWith(runner.name, 'blacksmith') && inputs.use_nixpacks != 'true' && steps.service.outputs.use_nixpacks_from_service != 'true') || (steps.images.outputs.enabled == 'true' && !startsWith(runner.name, 'blacksmith'))
      uses: docker/setup-buildx-action@v4
      with:
        version: latest
        endpoint: ${{ inputs.buildx_endpoint }}
        driver: ${{ inputs.buildx_driver }}

    - name: Expose GitHub runtime for Bake cache
      if: steps.images.outputs.enabled == 'true' && !startsWith(runner.name, 'blacksmith') && inputs.disable_cache != 'true'
      uses: crazy-max/ghaction-github-runtime@v3

    # Brokered login: ryvn create registry-config mints a short-lived
    # credential right before the build and writes a disposable Docker/Helm
    # config in the workspace (seeded from the caller's config, credential
    # helpers and other registries untouched). Managed GAR, customer ECR and
    # generic OCI registries all take this path. Its env is exported for the
    # build, push, inspection and chart steps; the cleanup step restores the
    # previous values and removes the workspace. Builds that outlive the credential fail at
    # push time; see README.
    - name: Log in to registry
      if: inputs.build_only != 'true' && steps.service.outputs.registry_provider == 'brokered'
      shell: bash
      env:
        RYVN_CLIENT_ID: ${{ inputs.ryvn_client_id }}
        RYVN_CLIENT_SECRET: ${{ inputs.ryvn_client_secret }}
        RYVN_API_URL: ${{ inputs.ryvn_api_url || env.RYVN_API_URL }}
        RYVN_AUTH_URL: ${{ inputs.ryvn_auth_url || env.RYVN_AUTH_URL }}
        RYVN_ORG_ID: ${{ inputs.ryvn_org_id || env.RYVN_ORG_ID }}
        RYVN_PROJECT_ID: ${{ inputs.ryvn_project_id || env.RYVN_PROJECT_ID }}
        SERVICE_NAME: ${{ inputs.service_name }}
        WORKSPACE: ${{ steps.workspace.outputs.dir }}
      run: |
        set -euo pipefail
        ryvn create registry-config "$WORKSPACE/registry-config" --service "$SERVICE_NAME" -o json > "$WORKSPACE/registry-config.json"
        {
          echo "RYVN_REGISTRY_CONFIG_ACTIVE=true"
          echo "RYVN_ORIGINAL_DOCKER_CONFIG=${DOCKER_CONFIG-}"
          echo "RYVN_ORIGINAL_HELM_REGISTRY_CONFIG=${HELM_REGISTRY_CONFIG-}"
          echo "RYVN_ORIGINAL_BUILDX_CONFIG=${BUILDX_CONFIG-}"
          echo "RYVN_ORIGINAL_DOCKER_CERT_PATH=${DOCKER_CERT_PATH-}"
          jq -r '.env | to_entries[] | "\(.key)=\(.value)"' "$WORKSPACE/registry-config.json"
        } >> "$GITHUB_ENV"
        jq -r '"Logged in to \(.server) as \(.username) until \(.expiresAt // "never")"' "$WORKSPACE/registry-config.json"

    # Nixpacks Build and Push (with build command)
    - name: Build and push with Nixpacks (with build command)
      if: steps.service.outputs.container_build == 'true' && (inputs.use_nixpacks == 'true' || steps.service.outputs.use_nixpacks_from_service == 'true') && steps.service.outputs.build_command != ''
      uses: iloveitaly/github-action-nixpacks@main
      with:
        context: ${{ steps.service.outputs.working_dir }}
        push: ${{ inputs.build_only != 'true' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        platforms: ${{ inputs.platforms }}
        pkgs: ${{ inputs.nixpacks_pkgs }}
        apt: ${{ inputs.nixpacks_apt }}
        cache: ${{ inputs.disable_cache == 'true' && 'false' || inputs.nixpacks_cache }}
        cache_tag: ${{ steps.service.outputs.image_ref }}:cache
        env: NIXPACKS_BUILD_CMD="${{ steps.service.outputs.build_command }}"

    # Nixpacks Build and Push (without build command)
    - name: Build and push with Nixpacks (without build command)
      if: steps.service.outputs.container_build == 'true' && (inputs.use_nixpacks == 'true' || steps.service.outputs.use_nixpacks_from_service == 'true') && steps.service.outputs.build_command == ''
      uses: iloveitaly/github-action-nixpacks@main
      with:
        context: ${{ steps.service.outputs.working_dir }}
        push: ${{ inputs.build_only != 'true' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        platforms: ${{ inputs.platforms }}
        pkgs: ${{ inputs.nixpacks_pkgs }}
        apt: ${{ inputs.nixpacks_apt }}
        cache: ${{ inputs.disable_cache == 'true' && 'false' || inputs.nixpacks_cache }}
        cache_tag: ${{ steps.service.outputs.image_ref }}:cache
        env: ${{ steps.service.outputs.build_args }}

    - name: Build and push Docker image (Blacksmith)
      id: build_blacksmith
      if: steps.service.outputs.container_build == 'true' && startsWith(runner.name, 'blacksmith') && inputs.use_nixpacks != 'true' && steps.service.outputs.use_nixpacks_from_service != 'true'
      uses: useblacksmith/build-push-action@v2
      with:
        context: ${{ steps.service.outputs.working_dir }}
        file: ${{ steps.service.outputs.dockerfile_path }}
        push: ${{ inputs.build_only != 'true' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: ${{ steps.service.outputs.build_args }}
        secrets: ${{ inputs.build_secrets }}
        platforms: ${{ inputs.platforms }}

    - name: Build and push Docker image (Docker)
      id: build_docker
      if: steps.service.outputs.container_build == 'true' && !startsWith(runner.name, 'blacksmith') && inputs.use_nixpacks != 'true' && steps.service.outputs.use_nixpacks_from_service != 'true'
      uses: docker/build-push-action@v7
      with:
        context: ${{ steps.service.outputs.working_dir }}
        file: ${{ steps.service.outputs.dockerfile_path }}
        push: ${{ inputs.build_only != 'true' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: ${{ steps.service.outputs.build_args }}
        secrets: ${{ inputs.build_secrets }}
        cache-from: ${{ inputs.disable_cache != 'true' && format('type=gha,scope={0}', inputs.service_name) || '' }}
        cache-to: ${{ inputs.disable_cache != 'true' && format('type=gha,mode=max,scope={0}', inputs.service_name) || '' }}
        platforms: ${{ inputs.platforms }}

    # Helm Chart Steps: packaging is local (no credential); the push resolves
    # the service's chart destination and authenticates from the GAR
    # registry-config env or, on ECR, the Docker config the ECR login wrote
    # (selected explicitly so a stale HELM_REGISTRY_CONFIG cannot shadow it).
    - name: Package Helm Chart
      id: helm_package
      if: steps.service.outputs.service_type == 'helm-chart.v1' && steps.images.outputs.enabled != 'true'
      shell: bash
      env:
        CHART_PATH: ${{ steps.service.outputs.helm_chart_path }}
        VERSION: ${{ inputs.version }}
        WORKSPACE: ${{ steps.workspace.outputs.dir }}
      run: |
        set -euo pipefail
        ryvn package chart "$CHART_PATH" --version "$VERSION" --destination "$WORKSPACE/chart" -o json > "$WORKSPACE/chart-package.json"
        echo "chart_package=$(jq -r '.path' "$WORKSPACE/chart-package.json")" >> "$GITHUB_OUTPUT"

    - name: Build images and package chart
      id: images_build
      if: steps.images.outputs.enabled == 'true'
      shell: bash
      env:
        WORKSPACE: ${{ steps.workspace.outputs.dir }}
        IMAGES_ENABLED: ${{ steps.images.outputs.enabled }}
        BUILD_ONLY: ${{ inputs.build_only }}
        PLATFORMS: ${{ inputs.platforms }}
        DISABLE_CACHE: ${{ inputs.disable_cache }}
        SERVICE_NAME: ${{ inputs.service_name }}
        VERSION: ${{ inputs.version }}
        CHART_PATH: ${{ steps.service.outputs.helm_chart_path }}
        BUILD_SECRETS: ${{ inputs.build_secrets }}
        USE_GHA_CACHE: ${{ !startsWith(runner.name, 'blacksmith') && inputs.disable_cache != 'true' }}
      run: |
        set -euo pipefail
        command -v python3 >/dev/null 2>&1 || {
          echo "::error::python3 is required when named image targets are enabled"
          exit 1
        }
        python3 - <<'PY'
        import json
        import os
        import stat

        with open(os.path.join(os.environ["WORKSPACE"], "images.json"), encoding="utf-8") as stream:
            images = json.load(stream)
        targets = {}
        for item in images["targets"]:
            name = item["name"]
            target = {
                "context": item["context"],
                "dockerfile": item["dockerfile"],
                "args": item["args"],
                "platforms": [platform.strip() for platform in os.environ["PLATFORMS"].split(",") if platform.strip()],
                "output": ["type=cacheonly" if os.environ["BUILD_ONLY"] == "true" else "type=registry"],
            }
            if item["repository"]:
                target["tags"] = [f'{item["repository"]}:{images["tag"]}']
            if os.environ.get("USE_GHA_CACHE") == "true":
                scope = f'{os.environ["SERVICE_NAME"]}-{name}'
                target["cache-from"] = [f"type=gha,scope={scope}"]
                target["cache-to"] = [f"type=gha,mode=max,scope={scope}"]
            targets[item["target"]] = target
        secret_index = 0
        for line in os.environ.get("BUILD_SECRETS", "").splitlines():
            if "=" not in line:
                continue
            key, value = line.split("=", 1)
            env_name = f"RYVN_BUILD_SECRET_{secret_index}"
            os.environ[env_name] = value
            for target in targets.values():
                target.setdefault("secret", []).append(f"id={key},env={env_name}")
            secret_index += 1
        bake = {"group": {"default": {"targets": [item["target"] for item in images["targets"]]}}, "target": targets}
        path = os.path.join(os.environ["WORKSPACE"], "bake.json")
        with open(path, "w", encoding="utf-8") as stream:
            json.dump(bake, stream, separators=(",", ":"))
        os.chmod(path, stat.S_IRUSR | stat.S_IWUSR)
        PY
        secret_index=0
        while IFS= read -r secret_line; do
          [[ -z "$secret_line" || "$secret_line" != *=* ]] && continue
          secret_key=${secret_line%%=*}
          secret_value=${secret_line#*=}
          export "RYVN_BUILD_SECRET_${secret_index}=$secret_value"
          secret_index=$((secret_index + 1))
        done <<< "$BUILD_SECRETS"

        : > "$WORKSPACE/bake.log"
        : > "$WORKSPACE/chart-package.log"
        allow_args=()
        while IFS= read -r context; do
          allow_args+=(--allow "fs.read=$context")
        done < <(jq -r '.targets[] | .context, (.dockerfile | sub("/[^/]*$"; ""))' "$WORKSPACE/images.json" | sort -u)
        (
          child_pid=""
          trap 'kill "$child_pid" 2>/dev/null || true' INT TERM
          echo "[$(date -u +%FT%T.%3NZ)] image bake started"
          status=0
          docker buildx bake "${allow_args[@]}" --file "$WORKSPACE/bake.json" --metadata-file "$WORKSPACE/bake-metadata.json" --progress plain &
          child_pid=$!
          wait "$child_pid" || status=$?
          echo "[$(date -u +%FT%T.%3NZ)] image bake finished (exit $status)"
          exit "$status"
        ) > "$WORKSPACE/bake.log" 2>&1 &
        bake_pid=$!
        (
          child_pid=""
          trap 'kill "$child_pid" 2>/dev/null || true' INT TERM
          echo "[$(date -u +%FT%T.%3NZ)] chart packaging started" >&2
          status=0
          ryvn package chart "$CHART_PATH" --version "$VERSION" --destination "$WORKSPACE/chart" -o json &
          child_pid=$!
          wait "$child_pid" || status=$?
          echo "[$(date -u +%FT%T.%3NZ)] chart packaging finished (exit $status)" >&2
          exit "$status"
        ) > "$WORKSPACE/chart-package.json" 2> "$WORKSPACE/chart-package.log" &
        chart_pid=$!
        trap 'kill "$bake_pid" "$chart_pid" 2>/dev/null || true; wait "$bake_pid" 2>/dev/null || true; wait "$chart_pid" 2>/dev/null || true; exit 143' INT TERM
        bake_status=0
        chart_status=0
        completed_pid=""
        first_status=0
        if wait -n -p completed_pid "$bake_pid" "$chart_pid"; then
          first_status=0
        else
          first_status=$?
        fi
        if [[ "$first_status" -ne 0 ]]; then
          if [[ "$completed_pid" == "$bake_pid" ]]; then
            kill "$chart_pid" 2>/dev/null || true
          else
            kill "$bake_pid" 2>/dev/null || true
          fi
        fi
        wait "$bake_pid" || bake_status=$?
        wait "$chart_pid" || chart_status=$?
        cat "$WORKSPACE/bake.log" "$WORKSPACE/chart-package.log"
        if [[ "$chart_status" -ne 0 && "$chart_status" -ne 143 ]]; then
          echo "::error::chart packaging failed"
          exit 1
        fi
        if [[ "$bake_status" -ne 0 ]]; then
          failed_targets="$(
            python3 - "$WORKSPACE/bake.log" <<'PY'
        import re
        import sys

        steps = {}
        failed = set()
        with open(sys.argv[1], encoding="utf-8") as stream:
            for line in stream:
                match = re.match(r"^#(\d+) \[img-([a-z0-9-]+)[ \]]", line)
                if match:
                    steps[match.group(1)] = match.group(2)
                match = re.match(r"^#(\d+) ERROR", line)
                if match and match.group(1) in steps:
                    failed.add(steps[match.group(1)])
                match = re.match(r"^ERROR: .*img-([a-z0-9-]+)", line)
                if match:
                    failed.add(match.group(1))
        print(" ".join(sorted(failed)))
        PY
          )"
          if [[ -z "$failed_targets" ]]; then
            failed_targets="$(jq -r '.targets[].name' "$WORKSPACE/images.json" | paste -sd ' ' -)"
          fi
          echo "::error::image build failed (targets: $failed_targets)"
          exit 1
        fi
        echo "chart_package=$(jq -r .path "$WORKSPACE/chart-package.json")" >> "$GITHUB_OUTPUT"
        if [[ "$BUILD_ONLY" != "true" ]]; then
          jq -n --slurpfile metadata "$WORKSPACE/bake-metadata.json" --slurpfile images "$WORKSPACE/images.json" '
            reduce $images[0].targets[] as $target ({}; .[$target.name] = ($metadata[0]["img-"+$target.name]["containerimage.digest"] // ""))' > "$WORKSPACE/image-digests.json"
          while IFS= read -r name; do
            digest="$(jq -r --arg name "$name" '.[$name] // ""' "$WORKSPACE/image-digests.json")"
            if [[ -z "$digest" || "$digest" == "null" || "$digest" != sha256:* ]]; then
              echo "::error::missing or invalid digest for image target $name"
              exit 1
            fi
          done < <(jq -r '.targets[].name' "$WORKSPACE/images.json")
        fi

    - name: Describe published images
      id: images_describe
      if: steps.images.outputs.enabled == 'true' && inputs.build_only != 'true'
      shell: bash
      env:
        WORKSPACE: ${{ steps.workspace.outputs.dir }}
        SERVICE_NAME: ${{ inputs.service_name }}
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        mkdir -p "$WORKSPACE/image-artifacts"
        while IFS= read -r name; do
          repository="$(jq -r --arg name "$name" '.targets[] | select(.name == $name) | .repository' "$WORKSPACE/images.json")"
          tag="$(jq -r .tag "$WORKSPACE/images.json")"
          digest="$(jq -r --arg name "$name" '.[$name]' "$WORKSPACE/image-digests.json")"
          if ! ryvn describe image "${repository}:${tag}" --name "$name" --digest "$digest" -o artifact > "$WORKSPACE/image-artifacts/$name.json"; then
            echo "::error::failed to describe published image target $name"
            exit 1
          fi
        done < <(jq -r '.targets[].name' "$WORKSPACE/images.json")
        jq -s 'add' "$WORKSPACE"/image-artifacts/*.json > "$WORKSPACE/image-artifacts.json"
        count="$(jq -r '[.[].name] | unique | length' "$WORKSPACE/image-artifacts.json")"
        total="$(jq -r 'length' "$WORKSPACE/image-artifacts.json")"
        expected="$(jq -r '.targets | length' "$WORKSPACE/images.json")"
        if [[ "$count" != "$expected" || "$total" != "$expected" ]]; then
          echo "::error::published image artifact names are not unique"
          exit 1
        fi

    - name: Push Helm Chart to Registry
      if: steps.service.outputs.service_type == 'helm-chart.v1' && inputs.build_only != 'true'
      shell: bash
      env:
        RYVN_CLIENT_ID: ${{ inputs.ryvn_client_id }}
        RYVN_CLIENT_SECRET: ${{ inputs.ryvn_client_secret }}
        RYVN_API_URL: ${{ inputs.ryvn_api_url || env.RYVN_API_URL }}
        RYVN_AUTH_URL: ${{ inputs.ryvn_auth_url || env.RYVN_AUTH_URL }}
        RYVN_ORG_ID: ${{ inputs.ryvn_org_id || env.RYVN_ORG_ID }}
        RYVN_PROJECT_ID: ${{ inputs.ryvn_project_id || env.RYVN_PROJECT_ID }}
        SERVICE_NAME: ${{ inputs.service_name }}
        CHART_PACKAGE: ${{ steps.helm_package.outputs.chart_package || steps.images_build.outputs.chart_package }}
        REGISTRY_PROVIDER: ${{ steps.service.outputs.registry_provider }}
        WORKSPACE: ${{ steps.workspace.outputs.dir }}
      run: |
        set -euo pipefail
        args=(push chart "$CHART_PACKAGE" --service "$SERVICE_NAME" -o artifact)
        if [[ "$REGISTRY_PROVIDER" == "ecr" ]]; then
          args+=(--registry-config "${DOCKER_CONFIG:-$HOME/.docker}/config.json")
        fi
        ryvn "${args[@]}" > "$WORKSPACE/artifacts.json"

    - name: Generate release inventory
      if: steps.service.outputs.service_type == 'helm-chart.v1' && inputs.build_only != 'true'
      shell: bash
      env:
        RYVN_CLIENT_ID: ${{ inputs.ryvn_client_id }}
        RYVN_CLIENT_SECRET: ${{ inputs.ryvn_client_secret }}
        RYVN_API_URL: ${{ inputs.ryvn_api_url || env.RYVN_API_URL }}
        RYVN_AUTH_URL: ${{ inputs.ryvn_auth_url || env.RYVN_AUTH_URL }}
        RYVN_ORG_ID: ${{ inputs.ryvn_org_id || env.RYVN_ORG_ID }}
        RYVN_PROJECT_ID: ${{ inputs.ryvn_project_id || env.RYVN_PROJECT_ID }}
        WORKSPACE: ${{ steps.workspace.outputs.dir }}
        SERVICE_NAME: ${{ inputs.service_name }}
        VERSION: ${{ inputs.version }}
        CHART_PACKAGE: ${{ steps.helm_package.outputs.chart_package || steps.images_build.outputs.chart_package }}
        REGISTRY_PROVIDER: ${{ steps.service.outputs.registry_provider }}
        IMAGES_ENABLED: ${{ steps.images.outputs.enabled }}
      run: |
        set -euo pipefail
        artifacts_file="$WORKSPACE/artifacts.json"
        if [[ "$IMAGES_ENABLED" == "true" ]]; then
          jq -s 'add' "$WORKSPACE/artifacts.json" "$WORKSPACE/image-artifacts.json" > "$WORKSPACE/release-artifacts.json"
          if [[ "$(jq '[.[].name] | unique | length' "$WORKSPACE/release-artifacts.json")" != "$(jq 'length' "$WORKSPACE/release-artifacts.json")" ]]; then
            echo "::error::release artifact names are not unique"
            exit 1
          fi
          artifacts_file="$WORKSPACE/release-artifacts.json"
        fi
        args=(create release-file "$SERVICE_NAME" "$VERSION" --chart "$CHART_PACKAGE" --artifacts-file "$artifacts_file" --output-file "$WORKSPACE/release.yaml")
        if [[ "$REGISTRY_PROVIDER" == "ecr" ]]; then
          args+=(--registry-config "${DOCKER_CONFIG:-$HOME/.docker}/config.json")
        fi
        ryvn "${args[@]}"
        if [[ "$IMAGES_ENABLED" == "true" ]]; then
          # release-file emits block YAML via sigs.k8s.io/yaml; PyYAML parses the
          # inventory and compares each published artifact (chart + images)
          # field-by-field against it.
          python3 -c 'import yaml' 2>/dev/null || PIP_BREAK_SYSTEM_PACKAGES=1 python3 -m pip install --quiet --user 'PyYAML==6.0.2' || {
            echo "::error::PyYAML is required to verify the release inventory when named image targets are enabled"
            exit 1
          }
        python3 - <<'PY'
        import json
        import os
        import sys

        import yaml


        def fail(message):
            print(f"::error::{message}", file=sys.stderr)
            raise SystemExit(1)


        workspace = os.environ["WORKSPACE"]
        service_name = os.environ["SERVICE_NAME"]
        version = os.environ["VERSION"]
        with open(os.path.join(workspace, "release.yaml"), encoding="utf-8") as stream:
            release = yaml.safe_load(stream)
        with open(os.path.join(workspace, "release-artifacts.json"), encoding="utf-8") as stream:
            expected = json.load(stream)

        if not isinstance(release, dict):
            fail("release inventory is not a mapping")
        if release.get("primaryArtifact") != service_name:
            fail(f"release inventory primary artifact is {release.get('primaryArtifact')!r}, expected {service_name!r}")
        if release.get("version") != version:
            fail(f"release inventory version is {release.get('version')!r}, expected {version!r}")
        artifacts = release.get("artifacts")
        if not isinstance(artifacts, list) or not all(isinstance(a, dict) for a in artifacts):
            fail("release inventory artifacts is not a list of mappings")
        by_name = {}
        for artifact in artifacts:
            name = artifact.get("name")
            if name in by_name:
                fail(f"release inventory artifact name {name!r} is not unique")
            by_name[name] = artifact

        charts = [a for a in expected if a.get("helmChart")]
        if len(charts) != 1 or charts[0].get("name") != service_name:
            fail(f"expected exactly one chart artifact named {service_name!r} in the published artifacts")

        for want in expected:
            got = by_name.get(want["name"])
            if got is None:
                fail(f"release inventory is missing artifact {want['name']!r}")
            if want.get("helmChart"):
                section, fields = "helmChart", ("repoUrl", "chartName", "version", "digest")
            else:
                section, fields = "image", ("repository", "tag", "digest")
            actual = got.get(section)
            if not isinstance(actual, dict):
                fail(f"release inventory artifact {want['name']!r} has no {section} entry")
            for field in fields:
                if actual.get(field) != want[section].get(field):
                    fail(
                        f"release inventory artifact {want['name']!r} {section}.{field} is "
                        f"{actual.get(field)!r}, expected {want[section].get(field)!r}"
                    )
        print(f"release inventory retains {len(expected)} published artifacts (primary: {service_name})")
        PY
        fi

    # The pushed image must resolve in the registry. When the build step
    # reports a push digest (Nixpacks does not) that exact content is
    # inspected, even if the tag has since moved; the tag itself is not
    # re-checked. build_only pushes nothing, so there is nothing to describe.
    - name: Describe container image
      if: steps.service.outputs.container_build == 'true' && inputs.build_only != 'true'
      shell: bash
      env:
        IMAGE_REFERENCE: ${{ steps.service.outputs.image_ref }}:${{ steps.meta.outputs.version }}
        SERVICE_NAME: ${{ inputs.service_name }}
        DIGEST: ${{ steps.build_docker.outputs.digest || steps.build_blacksmith.outputs.digest }}
        WORKSPACE: ${{ steps.workspace.outputs.dir }}
      run: |
        set -euo pipefail
        args=(describe image "$IMAGE_REFERENCE" --service "$SERVICE_NAME" -o artifact)
        if [[ -n "$DIGEST" ]]; then
          args+=(--digest "$DIGEST")
        fi
        ryvn "${args[@]}" > "$WORKSPACE/artifacts.json"

    # One service produces at most one artifact array (push chart or describe
    # image, never both); build_only produces none.
    - name: Emit build artifacts
      id: artifacts
      shell: bash
      env:
        WORKSPACE: ${{ steps.workspace.outputs.dir }}
        IMAGES_ENABLED: ${{ steps.images.outputs.enabled }}
      run: |
        set -euo pipefail
        artifacts="[]"
        artifacts_file="$WORKSPACE/artifacts.json"
        if [[ "${IMAGES_ENABLED-}" == "true" && -s "$WORKSPACE/release-artifacts.json" ]]; then
          artifacts_file="$WORKSPACE/release-artifacts.json"
        fi
        if [[ -s "$artifacts_file" ]]; then
          artifacts="$(jq -c . "$artifacts_file")"
        fi
        echo "Build artifacts: $artifacts"
        {
          echo "build_artifacts<<RYVN_ARTIFACTS_EOF"
          echo "$artifacts"
          echo "RYVN_ARTIFACTS_EOF"
        } >> "$GITHUB_OUTPUT"
        release_file=""
        if [[ -s "$WORKSPACE/release.yaml" ]]; then
          release_file="$(cat "$WORKSPACE/release.yaml")"
        fi
        {
          echo "release_file<<RYVN_RELEASE_FILE_EOF"
          echo "$release_file"
          echo "RYVN_RELEASE_FILE_EOF"
        } >> "$GITHUB_OUTPUT"

    # The workspace is this invocation's own mktemp directory: the registry
    # credentials live in it, as does whatever Docker writes into a
    # $DOCKER_CONFIG during a build (.token_seed, .token_seed.lock). Ordinary
    # temp-directory lifecycle: restore the environment the login step replaced,
    # then remove the whole workspace. The caller's original Docker/Helm/buildx
    # directories are never touched. (`ryvn delete registry-config` is for a
    # config placed inside a shared directory; here nothing else lives in it.)
    - name: Restore registry environment and remove workspace
      if: always() && steps.workspace.outputs.dir != ''
      shell: bash
      env:
        WORKSPACE: ${{ steps.workspace.outputs.dir }}
      run: |
        set +e -uo pipefail
        status=0
        if [[ "${RYVN_REGISTRY_CONFIG_ACTIVE-}" == "true" ]]; then
          {
            echo "RYVN_REGISTRY_CONFIG_ACTIVE="
            echo "DOCKER_CONFIG=${RYVN_ORIGINAL_DOCKER_CONFIG-}"
            echo "HELM_REGISTRY_CONFIG=${RYVN_ORIGINAL_HELM_REGISTRY_CONFIG-}"
            echo "BUILDX_CONFIG=${RYVN_ORIGINAL_BUILDX_CONFIG-}"
            echo "DOCKER_CERT_PATH=${RYVN_ORIGINAL_DOCKER_CERT_PATH-}"
          } >> "$GITHUB_ENV" || status=$?
        fi
        rm -rf "$WORKSPACE" || status=$?
        exit "$status"

branding:
  icon: "package"
  color: "blue"
